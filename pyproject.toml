[project]
name = "mmf"
version = "0.1.0.dev0"
description = "Manuscript-to-Model Framework (Nexus): human-in-the-loop translation of manuscripts and dataset documentation into data-grounded research strategies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ricardo Erazo" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "ollama>=0.4",
    "openai>=1.40",
    "typer>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "openpyxl>=3.1.5",
    "numpy>=1.26",
]

[project.urls]
Repository = "https://github.com/rickerazo/Nexus"
Issues = "https://github.com/rickerazo/Nexus/issues"

[project.scripts]
mmf = "mmf.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmf"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012", "E501"]
allowed-confusables = ["’", "‘", "“", "”", "–", "—"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests that call a running LLM backend (deselected by default)"]
addopts = "-m 'not live'"
