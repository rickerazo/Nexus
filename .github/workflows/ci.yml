name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check src tests benchmarks evaluation scripts
      - run: uv run ruff format --check src tests benchmarks evaluation scripts
      - run: uv run mypy src benchmarks evaluation scripts
      - run: uv run pytest -q --cov=mmf --cov-report=term-missing
