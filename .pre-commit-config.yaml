repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      # Archived run scripts under runs/ and the legacy prototype stay as they were run.
      - id: ruff
        args: [--fix]
        exclude: ^(data|runs|legacy)/
      - id: ruff-format
        exclude: ^(data|runs|legacy)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Inputs and run artifacts stay byte-identical: manifests and caches hash them.
      - id: end-of-file-fixer
        exclude: ^(data|runs|legacy)/
      - id: trailing-whitespace
        exclude: ^(data|runs|legacy)/
      - id: check-yaml
      # Run logs and codebooks are tracked; GitHub rejects files over 100 MB.
      - id: check-added-large-files
        args: [--maxkb=50000]
      - id: detect-private-key
