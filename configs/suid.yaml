# SUID proof-of-concept run configuration (Aim 3).
# Documentation only: codebooks and user guides. No row-level data.
manuscripts:
  - data/manuscripts/Erazo_SUID_manuscript_v1.docx     # developmental timing (PCA framework)
  - data/manuscripts/bedsharing_ms_v3.docx             # sleep environment + exposures
codebooks:
  - id: prams_p8_arf
    path: data/codebooks/PRAMS_Phase_8_ARF_Codebook.pdf
    title: PRAMS Phase 8 Analytic Research File codebook
  - id: prams_p8_std2
    path: data/codebooks/PRAMS_Phase_8_Standard_Section_II_Codebook.pdf
    title: PRAMS Phase 8 Standard Section II codebook
  - id: prams_p7_arf
    path: data/codebooks/PRAMS_Phase_7_ARF_Codebook.pdf
    title: PRAMS Phase 7 Analytic Research File codebook
  - id: cdc_linkco15
    path: data/codebooks/LinkCO15Guide.pdf  # https://data.nber.org/nvss/linkco/orig/LinkCO15Guide.pdf
    title: CDC linked birth/infant death public-use file guide, 2015
  # - id: ncfrp
  #   path: data/codebooks/NCFRP_data_dictionary.pdf
  #   title: National Child Fatality Review case reporting system data dictionary
backend: ollama
model: qwen2.5:14b
seed: 0
temperature: 0.0
num_ctx: 32768
chunk_tokens: 12000
max_retries: 3
n_gaps: 3
out_dir: runs
cache_dir: .cache/documents
